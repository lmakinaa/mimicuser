[project]
name = "mimicuser-backend"
version = "0.1.0"
description = "Autonomous synthetic customer research platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "dramatiq[redis]>=1.17",
    "redis>=5.2",
    "playwright>=1.49",
    "httpx>=0.28",
    "cryptography>=44.0",
    "anthropic>=0.69",
    "claude-agent-sdk>=0.1.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "aiosqlite>=0.20",
]

[tool.setuptools]
packages = [
    "app", "domain", "engines", "tools", "context",
    "storage", "orchestration", "repositories", "worker",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, no external services",
    "integration: needs postgres/redis/browser",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in an argument default is the FastAPI idiom, not a mutable
# default-argument bug.
"app/api/**" = ["B008"]
